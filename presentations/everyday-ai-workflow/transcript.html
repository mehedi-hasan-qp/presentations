<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talk Transcript</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --quote:#f3f1ec; --line:#ddd; --accent:#b4441c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --muted:#999; --quote:#1f1f1f; --line:#333; --accent:#ff8a5c; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:20px/1.6 -apple-system, system-ui, sans-serif; }
  main { max-width:40rem; margin:0 auto; padding:1rem 16px 6rem; }
  h1 { font-size:1.5rem; line-height:1.25; }
  h1:not(:first-child) { margin-top:3rem; padding-top:1rem; border-top:3px solid var(--accent); }
  h2 { position:sticky; top:0; background:var(--bg); margin:2.5rem -16px 0; padding:.5rem 16px; font-size:1.05rem; color:var(--accent); border-bottom:1px solid var(--line); z-index:1; }
  blockquote { margin:1rem 0; padding:.5rem .9rem; background:var(--quote); border-left:4px solid var(--accent); border-radius:6px; font-size:.9em; }
  blockquote p { margin:.3rem 0; }
  code { font-size:.85em; background:var(--quote); padding:.1em .3em; border-radius:4px; }
  table { border-collapse:collapse; font-size:.8em; width:100%; }
  td, th { border:1px solid var(--line); padding:.3rem .5rem; text-align:left; }
  hr { border:0; }
</style>
</head>
<body>
<main id="out">Loading…</main>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
  fetch('transcript.md', { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(md => { out.innerHTML = marked.parse(md); })
    .catch(e => { out.textContent = 'Could not load transcript.md (' + e.message + ')'; });
  // Keep the phone screen awake while reading on stage.
  if ('wakeLock' in navigator) {
    const lock = () => navigator.wakeLock.request('screen').catch(() => {});
    lock();
    document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && lock());
  }
</script>
</body>
</html>
